[project]
name = "dados-unicamp"
version = "0.1.0"
description = "Pipelines de processamento e integração de bases acadêmicas relacionadas à Unicamp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "fastparquet>=2024.2.0",
    "numpy==2.4.2",
    "openpyxl>=3.1.0",
    "pandas==3.0.1",
    "pyarrow>=17.0.0",
    "pytz==2025.2",
    "pyyaml>=6.0.0",
    "requests>=2.34.2",
    "swifter>=1.4.0",
    "textdistance>=4.6.0",
    "tqdm==4.67.3",
    "tzdata==2025.3",
    "unidecode>=1.3.0",
    "xlrd>=2.0.1",
    "zstandard>=0.23.0",
]

[tool.uv]
package = false
