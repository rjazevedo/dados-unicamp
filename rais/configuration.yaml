# Put the path to directory with input data, the path to directory where the clean files will be created and the path to uniao_dac_comvest database
# path_input_data aponta pro rais-novo (1985-2022) em vez do rais antigo (so
# 2002-2018) -- validado (2026-09-03) que e o MESMO dado pra 2002-2018, so
# reempacotado: arquivos que vinham divididos em partes (ex. SP2011ID1-4.txt,
# RAIS_VINC_ID_SP1-4.txt de 2018) viram um unico arquivo consolidado por
# ano/agrupamento no rais-novo, sem nenhuma outra diferenca -- confirmado por
# cmp binario (CENTRO_OESTE/2018, byte-a-byte identico) e conferencia de
# contagem de linhas (SP/2011 e SP/2018: soma das partes = consolidado + N-1
# cabecalhos duplicados removidos, exatamente). Isso elimina estruturalmente
# a classe de bug do arquivo orfao tipo SP-2011 pra todo o pipeline, nao so
# pros anos novos.
path_input_data:    /home/input/rais-novo/
path_output_data:   /home/output/rais/
path_intermediario: /home/output/intermediario/
path_pre_processed: /home/output/rais/pre_processed/
uniao_dac_comvest:  /home/output/intermediario/uniao_dac_comvest.csv
intervalo_rais:     [2002, 2022]
